name: Update Catalog

on:
  push:
    branches: [main]
    paths:
      - "library/*.epub"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    # Skip when the article workflow pushes EPUBs (it updates the catalog itself)
    if: github.actor != 'github-actions[bot]'

    # Job level, not step level: a step's own `env:` is applied after its `if:`
    # is evaluated, so guarding a step on a key it defines itself is a coin
    # toss. Declared here, the guard and the step see the same value.
    env:
      EPUB_ENCRYPT_KEY: ${{ secrets.EPUB_ENCRYPT_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rename EPUBs to UUID
        if: env.EPUB_ENCRYPT_KEY != ''
        run: |
          python3 - <<'EOF'
          import os, uuid, re
          UUID_RE = re.compile(
              r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          )
          for f in os.listdir("library"):
              if not f.endswith(".epub"):
                  continue
              stem = f[:-5]
              if not UUID_RE.match(stem):
                  new_name = str(uuid.uuid4()) + ".epub"
                  os.rename(f"library/{f}", f"library/{new_name}")
                  print(f"Renamed: {f} → {new_name}")
          EOF

      - name: Record titles before encrypting
        if: env.EPUB_ENCRYPT_KEY != ''
        run: |
          python3 - <<'EOF'
          import os, sys
          from datetime import datetime, timezone
          sys.path.insert(0, "scripts")
          from update_catalog import epub_title

          # update_catalog.py reads a book's title out of the zip, which stops
          # working the moment the file is encrypted -- and that happens in the
          # next step. Left alone it falls back to the filename, so every
          # manually uploaded book would be catalogued under its UUID. The
          # article workflow does not need this: fetch.py already knows the
          # title and writes it to the index itself.
          #
          # Recording the date here also pins it. Without an index entry,
          # collect_entries() falls back to the file's mtime, which in CI is
          # the checkout time -- so the catalog would reshuffle on every run.
          lines = []
          for f in sorted(os.listdir("library")):
              if not f.endswith(".epub"):
                  continue
              path = os.path.join("library", f)
              with open(path, "rb") as fh:
                  if fh.read(8) == b"Salted__":
                      continue   # already encrypted, so already in the index
              title = epub_title(path) or f[:-5]
              date = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              lines.append(f"{f}\t{title}\t\t{date}\n")
              print(f"Indexed: {f} -> {title}")
          if lines:
              with open("library/index.tsv", "a", encoding="utf-8") as fh:
                  fh.writelines(lines)
          EOF

      - name: Encrypt unencrypted EPUBs
        if: env.EPUB_ENCRYPT_KEY != ''
        run: |
          # Test the header openssl actually writes. The previous test asked
          # file(1) whether this was a "Zip archive", which it stopped saying
          # once it learned to recognise EPUBs -- it reports "EPUB document".
          # The condition was simply never true, so every manually uploaded
          # book was committed and published in the clear.
          for epub in library/*.epub; do
            [ -f "$epub" ] || continue
            if [ "$(head -c 8 "$epub")" = "Salted__" ]; then
              echo "Already encrypted: $epub"
              continue
            fi
            openssl enc -aes-256-cbc -pbkdf2 -k "$EPUB_ENCRYPT_KEY" \
              -in "$epub" -out "$epub.tmp" && mv "$epub.tmp" "$epub"
            echo "Encrypted: $epub"
          done

      - name: Update catalog
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python scripts/update_catalog.py

      - name: Verify nothing plaintext is about to be committed
        if: env.EPUB_ENCRYPT_KEY != ''
        run: |
          # A key is configured, so anything readable reaching the commit below
          # would be published readable by anyone. Fail instead: publishing in
          # the clear is worse than not publishing.
          fail=0
          for epub in library/*.epub; do
            [ -f "$epub" ] || continue
            if [ "$(head -c 8 "$epub")" != "Salted__" ]; then
              echo "::error::$epub is not encrypted"; fail=1
            fi
          done
          # update_catalog.py only deletes these once their encrypted twin was
          # written; if encryption failed they survive, and `git add -A` would
          # happily commit them.
          for leftover in catalog.xml library/index.tsv; do
            if [ -e "$leftover" ]; then
              echo "::error::$leftover is still plaintext"; fail=1
            fi
          done
          exit $fail

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A over the whole tree, so the plaintext catalog.xml that
          # update_catalog.py deletes once a key is set is staged as a
          # deletion. Naming the paths explicitly made the run die with
          # "pathspec did not match any files" the moment that file was gone
          # for good. The step above is what makes this safe.
          git add -A
          git diff --cached --quiet || git commit -m "catalog: update after EPUB upload"
          git push
