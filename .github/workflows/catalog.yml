name: Update Catalog

on:
  push:
    branches: [main]
    paths:
      - "library/*.epub"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    # Skip when the article workflow pushes EPUBs (it updates the catalog itself)
    if: github.actor != 'github-actions[bot]'

    # Job level, not step level: a step's own `env:` is applied after its `if:`
    # is evaluated, so guarding a step on a key it defines itself is a coin
    # toss. Declared here, the guard and the step see the same value.
    env:
      EPUB_ENCRYPT_KEY: ${{ secrets.EPUB_ENCRYPT_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rename EPUBs to UUID
        if: env.EPUB_ENCRYPT_KEY != ''
        run: |
          python3 - <<'EOF'
          import os, uuid, re
          UUID_RE = re.compile(
              r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          )
          for f in os.listdir("library"):
              if not f.endswith(".epub"):
                  continue
              stem = f[:-5]
              if not UUID_RE.match(stem):
                  new_name = str(uuid.uuid4()) + ".epub"
                  os.rename(f"library/{f}", f"library/{new_name}")
                  print(f"Renamed: {f} → {new_name}")
          EOF

      - name: Encrypt unencrypted EPUBs
        if: env.EPUB_ENCRYPT_KEY != ''
        run: |
          # Test the header openssl actually writes. The previous test asked
          # file(1) whether this was a "Zip archive", which it stopped saying
          # once it learned to recognise EPUBs -- it reports "EPUB document".
          # The condition was simply never true, so every manually uploaded
          # book was committed and published in the clear.
          for epub in library/*.epub; do
            [ -f "$epub" ] || continue
            if [ "$(head -c 8 "$epub")" = "Salted__" ]; then
              echo "Already encrypted: $epub"
              continue
            fi
            openssl enc -aes-256-cbc -pbkdf2 -k "$EPUB_ENCRYPT_KEY" \
              -in "$epub" -out "$epub.tmp" && mv "$epub.tmp" "$epub"
            echo "Encrypted: $epub"
          done

      - name: Verify every EPUB is encrypted
        if: env.EPUB_ENCRYPT_KEY != ''
        run: |
          # A key is configured, so a plain book reaching the commit below
          # would be published readable by anyone. Fail instead.
          fail=0
          for epub in library/*.epub; do
            [ -f "$epub" ] || continue
            if [ "$(head -c 8 "$epub")" != "Salted__" ]; then
              echo "::error::$epub is not encrypted"
              fail=1
            fi
          done
          exit $fail

      - name: Update catalog
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python scripts/update_catalog.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A so that the plaintext catalog.xml update_catalog.py deletes once
          # a key is set is actually staged as a deletion, instead of lingering
          # tracked and published forever.
          git add -A library/ catalog.xml catalog.xml.enc
          git diff --cached --quiet || git commit -m "catalog: update after EPUB upload"
          git push
